*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
header{background:var(--surface);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:18px;padding:18px 22px;box-shadow:0 6px 24px rgba(11,60,80,.12)}
.banner,.wrap>.meta,.wrap>.progress{position:relative}
.wrap>.meta{background:var(--surface);border-radius:12px;padding:6px 12px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);margin-top:6px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:700}
.card{background:var(--surface);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(11,60,80,.12);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.progress{display:flex;gap:3px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--surface)}
.progress span.done{background:var(--sage)}
.progress span.now{background:var(--sun)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sage-soft);color:var(--sage)}
.tag.m{background:var(--blush-soft);color:var(--blush)}
.q{font-family:var(--display);font-size:clamp(1.3rem,4.5vw,1.6rem);line-height:1.25;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;min-width:0;background:var(--surface);color:var(--ink)}
.opt b{color:var(--muted);font-weight:700}
.opt.sel{border-color:var(--sage);background:var(--sage-soft)}
.opt.sel b{color:var(--sage)}
.note{border:1.5px dashed var(--blush);border-radius:12px;padding:12px 14px;color:var(--muted);background:var(--blush-soft);font-size:.95rem}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1}
button{font:inherit;font-weight:600;border-radius:12px;padding:11px 18px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--blush);border-color:var(--blush);color:var(--on-primary)}
button.ghost{background:transparent}
button.warn{border-color:var(--blush);color:var(--blush)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blush);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.li .s{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.3rem}
.pill{font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sage-soft);color:var(--sage)}
.pill.open{background:var(--blush-soft);color:var(--blush)}
.winner{text-align:center;padding:26px 22px;background:var(--sage-soft);border-color:var(--sage)}
.winner{background:linear-gradient(135deg,var(--blush-soft),var(--sage-soft))}
.winner .crown{font-family:var(--display);font-size:clamp(2rem,8vw,3rem);line-height:1.1;color:var(--sage);overflow-wrap:anywhere}
.rank{width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.guess{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.guess:last-child{border-bottom:0}
.guess .who{font-weight:600;min-width:5.5em}
.guess .what{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.guess button{padding:5px 12px;font-size:.9rem}
.guess button.on{background:var(--sage);border-color:var(--sage);color:var(--on-primary)}
.fq{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.fq:last-child{border-bottom:0}
.fq .t{font-weight:600}
.small{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:no-preference){.card{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1}}}
.banner{border:1.5px solid var(--blush);background:var(--blush-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.9rem;margin:0}
.err{color:var(--blush);font-weight:600}
</style>

  {id:"m4",cat:"Marianne svarer",m:true,q:"Hvem ville Marianne tatt med seg på en øde øy?"},
  {id:"m5",cat:"Marianne svarer",m:true,q:"Hvis Marianne fikk 10 millioner kroner, hva ville hun brukt dem på?",o:["Drømmehus med spa i kjelleren","Jorda rundt, med første stopp i New York","Sesongkort til alle Disney-parkene i verden"]},
  {id:"m6",cat:"Marianne svarer",m:true,q:"Hva irriterer Marianne mest?",o:["Folk som kommer for sent","Sokker som blir liggende på gulvet","Folk som tygger med åpen munn","Når Claus sier «vi får se»"]},
  {id:"m7",cat:"Marianne svarer",m:true,q:"Hva var det første Marianne tenkte da Claus dukket opp i New York?"},
  {id:"m8",cat:"Marianne svarer",m:true,q:"Hvilken Disney-figur ligner Claus mest på?"},
  {id:"m9",cat:"Marianne svarer",m:true,q:"Hvem sa «jeg elsker deg» først?",o:["Marianne","Claus"]}
];
const L="ABCD";
const CLOUD=!!API_URL;
const K_LOCAL="mq-local-v3", K_ME="mq-me-v3", K_HOST="mq-host-v3";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isOpen=q=>!q.o&&!q.num;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

let S={players:[],fasit:{},awards:{}}, loaded=false, loadErr="";
let me=lsGet(K_ME);           // denne telefonens deltaker: {name, answers, qi, done}
let host=!!lsGet(K_HOST);
let view="home", confirmReset=false, gateTarget="results", saveMsg="";

/* ===== Lagring ===== */
function norm(j){return {players:Array.isArray(j.players)?j.players:[],fasit:j.fasit||{},awards:j.awards||{}}}
async function load(){
  try{
    if(CLOUD){const r=await fetch(API_URL+"?t="+Date.now());const j=await r.json();if(j.error)throw new Error(j.error);S=norm(j);}
    else{const s=lsGet(K_LOCAL);if(s)S=norm(s);}
    loaded=true;loadErr="";
  }catch(e){loaded=true;loadErr="Fikk ikke kontakt med lagringen. Sjekk at du har nett, og prøv igjen.";}
}
function applyLocal(b){
  if(b.type==="player"){const p=S.players.find(x=>x.name.toLowerCase()===b.player.name.toLowerCase());
    const row={name:b.player.name,done:!!b.player.done,t:Date.now(),answers:b.player.answers||{}};
    if(p)Object.assign(p,row);else S.players.push(row);}
  if(b.type==="fasit")S.fasit=b.fasit;
  if(b.type==="awards")S.awards=b.awards;
  if(b.type==="reset")S={players:[],fasit:{},awards:{}};
  lsSet(K_LOCAL,S);
}
async function send(b){
  if(!CLOUD){applyLocal(b);return;}
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(b)});
  const j=await r.json(); if(j.error)throw new Error(j.error); S=norm(j);
}
const findPlayer=n=>S.players.find(p=>p.name.toLowerCase()===n.toLowerCase());
function saveMe(){lsSet(K_ME,me);}

/* ===== Poeng ===== */
function done(){return S.players.filter(p=>p.done);}
function numWinners(q){
  const f=parseFloat(S.fasit[q.id]); if(isNaN(f))return [];
  let best=Infinity,w=[];
  done().forEach(p=>{const v=parseFloat(p.answers[q.id]);if(isNaN(v))return;
    const d=Math.abs(v-f);if(d<best){best=d;w=[p.name]}else if(d===best)w.push(p.name);});
  return w;
}
function score(p){
  let s=0;
  Q.forEach(q=>{const a=p.answers[q.id];
    if(q.a!==undefined){if(a===q.a)s++;}
    else if(q.o){if(S.fasit[q.id]!==undefined&&a===S.fasit[q.id])s++;}
    else if(q.num){if(numWinners(q).includes(p.name))s++;}
    else if((S.awards[q.id]||[]).includes(p.name))s++;
  });
  return s;
}

/* ===== Forside ===== */
function whoHTML(){
  if(!loaded)return `<p class="empty">Henter deltakere …</p>`;
  if(loadErr)return `<p class="err">${esc(loadErr)}</p>`;
  if(!S.players.length)return `<p class="empty">Ingen har startet ennå.</p>`;
  return `<div class="list">${S.players.map(p=>`<div class="li"><span class="n">${esc(p.name)}</span><span class="pill ${p.done?"":"open"}">${p.done?"Ferdig":"Svarer nå"}</span></div>`).join("")}</div>`;
}
function renderWho(){const el=document.getElementById("who");if(el)el.innerHTML=whoHTML();
  const c=document.getElementById("doneCount");if(c)c.textContent=`${done().length} ferdig`;}
function home(){
  const resume=me&&!me.done;
  app.innerHTML=`
  <header>
    <div class="eyebrow">Utdrikningslag · The Well</div>
    <h1>Hvor godt kjenner du Marianne?</h1>
    <p class="lead">${Q.length} spørsmål. Svar på din egen telefon. Vinneren kåres når alle er ferdige.</p>
  </header>
  ${!CLOUD?`<p class="banner">Skylagring er ikke koblet til. Svarene lagres bare på denne telefonen.</p>`:""}
  ${resume?`<section class="card">
    <h2>Fortsett der du slapp</h2>
    <p class="small">${esc(me.name)}, du har svart på ${Object.keys(me.answers).length} av ${Q.length} spørsmål.</p>
    <div class="row"><button class="primary grow" id="resume">Fortsett som ${esc(me.name)}</button><button class="ghost" id="notMe">Ikke meg</button></div>
  </section>`:""}
  ${me&&me.done?`<section class="card"><h2>Takk, ${esc(me.name)}!</h2><p class="small">Svarene dine er levert. Nå er det bare å vente på kåringen.</p></section>`:""}
  ${!resume&&!(me&&me.done)?`<form class="card" id="start">
    <h2>Hvem er du?</h2>
    <input type="text" id="name" placeholder="Fornavnet ditt" autocomplete="off" aria-label="Fornavnet ditt" maxlength="30">
    <button class="primary" type="submit">Start quizen</button>
    <p class="small err" id="msg"></p>
  </form>`:""}
  <section class="card">
    <div class="meta"><h2>Deltakere</h2><span class="pill" id="doneCount">${done().length} ferdig</span></div>
    <div id="who">${whoHTML()}</div>
  </section>
  <section class="card">
    <h2>For quizmaster og Marianne</h2>
    <div class="row">
      <button id="toFasit">Mariannes fasit</button>
      <button id="toRes" class="primary grow">Kår vinneren</button>
    </div>
    ${me&&me.done?`<button class="ghost" id="newPerson">Ny deltaker på denne telefonen</button>`:""}
  </section>`;
  const f=document.getElementById("start");
  if(f)f.addEventListener("submit",async e=>{
    e.preventDefault();const nameEl=document.getElementById("name"),msg=document.getElementById("msg");
    const n=nameEl.value.trim();if(!n){nameEl.focus();return;}
    const btn=f.querySelector("button");btn.disabled=true;btn.textContent="Sjekker navnet …";
    await load();
    if(loadErr){msg.textContent=loadErr;btn.disabled=false;btn.textContent="Start quizen";return;}
    const p=findPlayer(n);
    if(p&&p.done){msg.textContent=`${p.name} har allerede levert. Legg til etternavn eller forbokstav.`;btn.disabled=false;btn.textContent="Start quizen";return;}
    me={name:p?p.name:n,answers:p?{...p.answers}:{},qi:0,done:false};
    const first=Q.findIndex(q=>me.answers[q.id]===undefined);me.qi=first<0?0:first;saveMe();
    send({type:"player",player:{name:me.name,answers:me.answers,done:false}}).catch(()=>{});
    go("quiz");
  });
  const r=document.getElementById("resume");if(r)r.onclick=()=>go("quiz");
  const nm=document.getElementById("notMe");if(nm)nm.onclick=()=>{me=null;saveMe();home();};
  const np=document.getElementById("newPerson");if(np)np.onclick=()=>{me=null;saveMe();home();};
  document.getElementById("toFasit").onclick=()=>gate("fasit");
  document.getElementById("toRes").onclick=()=>gate("results");
}

/* ===== Quiz ===== */
function quiz(){
  const qi=me.qi,q=Q[qi],a=me.answers[q.id],last=qi===Q.length-1;
  let body="";
  if(q.o)body=`<div class="opts">${q.o.map((t,k)=>`<button class="opt ${a===k?"sel":""}" data-k="${k}" aria-pressed="${a===k}"><b>${L[k]}</b><span>${esc(t)}</span></button>`).join("")}</div>`;
  else body=`<input type="${q.num?"number":"text"}" id="ans" ${q.num?'inputmode="numeric"':""} placeholder="${q.num?"Antall år":"Ditt svar"}" value="${esc(a??"")}" aria-label="Ditt svar">`;
  app.innerHTML=`
  <div class="meta"><span class="eyebrow">${esc(me.name)} svarer</span><span class="small">${qi+1} av ${Q.length}</span></div>
  <div class="progress" aria-hidden="true">${Q.map((x,k)=>`<span class="${k===qi?"now":me.answers[x.id]!==undefined?"done":""}"></span>`).join("")}</div>
  <section class="card">
    <div class="meta"><span class="tag ${q.m?"m":""}">${esc(q.cat)}</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    ${q.hint||(q.m&&!q.o)?`<p class="note">${esc(q.hint||"Skriv det du tror. Marianne er fasiten, og quizmaster deler ut poeng til slutt.")}</p>`:""}
    ${body}
    <div class="row">
      <button id="prev" ${qi===0?"disabled":""}>Forrige</button>
      <button id="next" class="primary grow">${last?"Lever svarene":"Neste"}</button>
    </div>
  </section>
  <div class="row"><button id="pause" class="ghost">Ta en pause</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{me.answers[q.id]=+b.dataset.k;saveMe();
    if(!last){me.qi++;saveMe();quiz();}else quiz();});
  const inp=document.getElementById("ans");
  const keep=()=>{if(!inp)return;const v=inp.value.trim();if(v)me.answers[q.id]=v;else delete me.answers[q.id];saveMe();};
  if(inp){inp.addEventListener("input",keep);inp.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("next").click();});}
  document.getElementById("prev").onclick=()=>{keep();me.qi--;saveMe();quiz();};
  document.getElementById("next").onclick=()=>{keep();if(!last){me.qi++;saveMe();quiz();}else submit();};
  document.getElementById("pause").onclick=()=>{keep();
    send({type:"player",player:{name:me.name,answers:me.answers,done:false}}).catch(()=>{});go("home");};
}
async function submit(){
  app.innerHTML=`<section class="card winner"><div class="eyebrow">Sender</div><div class="crown">Et øyeblikk …</div><p>Svarene dine lagres.</p></section>`;
  try{
    await send({type:"player",player:{name:me.name,answers:me.answers,done:true}});
    me.done=true;saveMe();
    const miss=Q.filter(x=>me.answers[x.id]===undefined).length;
    app.innerHTML=`<section class="card winner">
      <div class="eyebrow">Levert</div>
      <div class="crown">Takk, ${esc(me.name)}!</div>
      <p>${miss?`Du hoppet over ${miss} spørsmål, men svarene er levert.`:"Alle svarene dine er lagret."} Poengene holdes hemmelig til vinneren kåres.</p>
      <button class="primary" id="back">Til forsiden</button>
    </section>`;
    document.getElementById("back").onclick=()=>go("home");
  }catch(e){
    app.innerHTML=`<section class="card">
      <h2>Svarene ble ikke sendt</h2>
      <p class="err">Fikk ikke kontakt med lagringen. Svarene dine ligger trygt på telefonen. Sjekk at du har nett og prøv igjen.</p>
      <div class="row"><button class="primary grow" id="retry">Prøv igjen</button><button id="backQ">Tilbake til spørsmålene</button></div>
    </section>`;
    document.getElementById("retry").onclick=submit;
    document.getElementById("backQ").onclick=()=>go("quiz");
  }
}

/* ===== Kode for quizmaster ===== */
function gate(target){
  if(host){go(target);return;}
  gateTarget=target;
  app.innerHTML=`<form class="card" id="pin">
    <div class="eyebrow">Bare for quizmaster og Marianne</div>
    <h2>Skriv inn koden</h2>
    <input type="text" id="code" autocomplete="off" aria-label="Kode" placeholder="Kode">
    <p class="small err" id="pmsg"></p>
    <div class="row"><button type="button" id="cancel">Avbryt</button><button class="primary grow" type="submit">Åpne</button></div>
  </form>`;
  document.getElementById("code").focus();
  document.getElementById("cancel").onclick=()=>go("home");
  document.getElementById("pin").addEventListener("submit",e=>{e.preventDefault();
    if(document.getElementById("code").value.trim().toLowerCase()===PIN.toLowerCase()){host=true;lsSet(K_HOST,true);go(gateTarget);}
    else document.getElementById("pmsg").textContent="Feil kode. Spør quizmaster.";});
}

/* ===== Mariannes fasit ===== */
async function saveFasit(){
  setSave("Lagrer …");
  try{await send({type:"fasit",fasit:S.fasit});setSave("Lagret ✓");}
  catch(e){setSave("Ble ikke lagret. Sjekk nettet og prøv igjen.");}
}
function setSave(t){saveMsg=t;const el=document.getElementById("saveMsg");if(el)el.textContent=t;}
async function fasit(){
  const mq=Q.filter(q=>q.m);
  app.innerHTML=`
  <header>
    <div class="eyebrow">Bare for Marianne</div>
    <h1>Mariannes fasit</h1>
    <p class="lead">Svar ærlig. Disse svarene avgjør hvem som får poeng på dine spørsmål.</p>
  </header>
  <section class="card">
    ${mq.map(q=>`<div class="fq"><span class="t">${esc(q.q)}</span>${
      q.o?`<div class="opts">${q.o.map((t,k)=>`<button class="opt ${S.fasit[q.id]===k?"sel":""}" data-q="${q.id}" data-k="${k}" aria-pressed="${S.fasit[q.id]===k}"><b>${L[k]}</b><span>${esc(t)}</span></button>`).join("")}</div>`
      :`<input type="${q.num?"number":"text"}" data-q="${q.id}" value="${esc(S.fasit[q.id]??"")}" placeholder="${q.num?"Antall år":"Mariannes svar"}" aria-label="Mariannes svar">`
    }</div>`).join("")}
  </section>
  <p class="small" id="saveMsg">${esc(saveMsg)}</p>
  <div class="row"><button class="primary grow" id="back">Ferdig</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.fasit[b.dataset.q]=+b.dataset.k;
    app.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(o=>{const on=o===b;o.classList.toggle("sel",on);o.setAttribute("aria-pressed",on);});
    saveFasit();});
  app.querySelectorAll("input[data-q]").forEach(i=>i.addEventListener("change",()=>{const v=i.value.trim();
    if(v)S.fasit[i.dataset.q]=v;else delete S.fasit[i.dataset.q];saveFasit();}));
  document.getElementById("back").onclick=()=>{saveMsg="";go("home");};
}

/* ===== Kåring ===== */
function results(){
  const d=done();
  const ranked=d.map(p=>({p,s:score(p)})).sort((a,b)=>b.s-a.s);
  const top=ranked.length?ranked[0].s:0;
  const winners=ranked.filter(r=>r.s===top&&top>0);
  const missingFasit=Q.filter(q=>q.m&&!isOpen(q)&&S.fasit[q.id]===undefined).length;
  const notDone=S.players.filter(p=>!p.done);
  const sy=window.scrollY;
  app.innerHTML=`
  <header>
    <div class="eyebrow">Resultater</div>
    <h1>Hvem kjenner Marianne best?</h1>
  </header>
  ${loadErr?`<p class="err">${esc(loadErr)}</p>`:""}
  ${notDone.length?`<p class="banner">Svarer fortsatt: ${notDone.map(p=>esc(p.name)).join(", ")}</p>`:""}
  ${winners.length?`<section class="card winner">
      <div class="eyebrow">${winners.length>1?"Delt seier":"Vinneren er"}</div>
      <div class="crown">${winners.map(w=>esc(w.p.name)).join(" og ")}</div>
      <p>${top} av ${Q.length} poeng</p>
    </section>`
    :`<section class="card"><p class="empty">${d.length?"Ingen poeng ennå. Sjekk at Marianne har fylt inn fasit, og del ut poeng for fritekstsvar under.":"Ingen har levert svar ennå."}</p></section>`}
  ${d.length?`<section class="card">
    <div class="meta"><h2>Poengtavle</h2><button id="refresh" class="ghost">Oppdater</button></div>
    <div class="list">${ranked.map((r,k)=>`<div class="li"><span class="rank">${k+1}.</span><span class="n">${esc(r.p.name)}</span><span class="s">${r.s}</span></div>`).join("")}</div>
    <p class="small">${missingFasit?`Marianne mangler fasit på ${missingFasit} av sine flervalgsspørsmål.`:"Marianne har fylt inn fasit på flervalgsspørsmålene sine."} Listen oppdateres av seg selv.</p>
  </section>
  <section class="card">
    <h2>Del ut poeng for fritekst</h2>
    <p class="small">Les opp svarene, la Marianne avgjøre, og trykk «Poeng» på de som traff.</p>
    ${Q.filter(isOpen).map(q=>`<div class="fq"><span class="t">${esc(q.q)}</span>
      ${S.fasit[q.id]?`<span class="small">Marianne: ${esc(S.fasit[q.id])}</span>`:""}
      <div>${d.map(p=>{const on=(S.awards[q.id]||[]).includes(p.name);
        return `<div class="guess"><span class="who">${esc(p.name)}</span><span class="what">${esc(p.answers[q.id]??"–")}</span><button class="${on?"on":""}" data-q="${q.id}" data-n="${esc(p.name)}" aria-pressed="${on}">${on?"Poeng ✓":"Poeng"}</button></div>`}).join("")}</div>
    </div>`).join("")}
    ${Q.filter(q=>q.num).map(q=>{const w=numWinners(q);return `<div class="fq"><span class="t">${esc(q.q)}</span>
      <span class="small">${S.fasit[q.id]?`Marianne: ${esc(S.fasit[q.id])} år. Nærmest: ${w.length?w.map(esc).join(", "):"ingen"}.`:"Marianne må fylle inn antall år i fasiten. Poenget går automatisk til den som er nærmest."}</span>
      <div>${d.map(p=>`<div class="guess"><span class="who">${esc(p.name)}</span><span class="what">${esc(p.answers[q.id]??"–")}</span></div>`).join("")}</div></div>`}).join("")}
  </section>`:""}
  <div class="row"><button id="back">Til forsiden</button><button id="toFasit" class="grow">Mariannes fasit</button></div>
  <div class="row"><button id="reset" class="ghost warn">${confirmReset?"Trykk igjen for å slette alle svar":"Nullstill quizen"}</button></div>`;
  window.scrollTo(0,sy);
  app.querySelectorAll("button[data-n]").forEach(b=>b.onclick=async()=>{
    const arr=S.awards[b.dataset.q]||(S.awards[b.dataset.q]=[]);const n=b.dataset.n;const i=arr.indexOf(n);
    if(i>=0)arr.splice(i,1);else arr.push(n);results();
    try{await send({type:"awards",awards:S.awards});}catch(e){loadErr="Poenget ble ikke lagret. Sjekk nettet og trykk igjen.";}
    results();});
  const rf=document.getElementById("refresh");if(rf)rf.onclick=async()=>{rf.textContent="Henter …";await load();results();};
  document.getElementById("back").onclick=()=>go("home");
  document.getElementById("toFasit").onclick=()=>go("fasit");
  document.getElementById("reset").onclick=async()=>{
    if(!confirmReset){confirmReset=true;results();return;}
    confirmReset=false;
    try{await send({type:"reset"});me=null;saveMe();}catch(e){loadErr="Fikk ikke nullstilt. Sjekk nettet.";}
    results();};
}

/* ===== Navigasjon ===== */
function go(v){view=v;if(v!=="results")confirmReset=false;window.scrollTo(0,0);
  ({home,quiz,fasit,results}[v]||home)();}

(async function start(){
  go("home");
  await load();
  if(view==="home")renderWho();
  if(CLOUD)setInterval(async()=>{if(view!=="home"&&view!=="results")return;await load();
    if(view==="home")renderWho();if(view==="results")results();},15000);
})();
</script>
</body>
</html>
